<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Kehadiran Kursus</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div class="masthead-left">
      <div class="brand-mark">UPKV</div>
      <div>
        <p class="eyebrow">Sistem Kehadiran Perbengkelan / Mesyuarat UPKV BPLTV</p>
        <h1>Papan Kursus</h1>
        <p class="sub">Urus kursus, senarai peserta &amp; rekod kehadiran</p>
      </div>
    </div>
    <button class="btn" id="btnBaru">+ Kursus Baru</button>
  </div>

  <div id="kursusGrid" class="kursus-grid"></div>
  <div id="emptyState" class="empty-state" style="display:none">
    <div class="stamp-mark">BELUM ADA KURSUS</div>
    <p>Mulakan dengan menambah kursus pertama anda.</p>
  </div>

</div>

<!-- Modal: Kursus Baru -->
<dialog id="modalBaru">
  <form id="formBaru">
    <div class="modal-head">
      <h2>Kursus Baru</h2>
      <button type="button" class="modal-close" id="btnTutup">&times;</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Nama Kursus</label>
        <input type="text" name="nama" required placeholder="cth: Bengkel Kenderaan Elektrik Siri 3">
      </div>
      <div class="row-2">
        <div class="field">
          <label>Tarikh Mula</label>
          <input type="date" name="tarikhMula" required>
        </div>
        <div class="field">
          <label>Tarikh Tamat <span style="text-transform:none; font-weight:400;">(jika berbeza)</span></label>
          <input type="date" name="tarikhTamat">
        </div>
      </div>
      <div class="row-2">
        <div class="field">
          <label>Masa</label>
          <input type="text" name="masa" placeholder="cth: 8:30 AM - 1:00 PM">
        </div>
        <div class="field">
          <label>Lokasi</label>
          <input type="text" name="lokasi" placeholder="cth: Bengkel Automotif A">
        </div>
      </div>
      <div class="field">
        <label>Anjuran</label>
        <input type="text" name="anjuran" placeholder="cth: BPLTV / Jabatan Teknologi Automotif">
      </div>
      <div class="field">
        <label>Senarai Peserta (pilihan — boleh tambah kemudian)</label>
        <textarea name="senaraiPeserta" placeholder="Satu peserta satu baris:
Ahmad bin Ali, 900101-01-1234, Teknologi Automotif
Siti Aminah, STAFF-221, Teknologi Elektronik"></textarea>
        <p class="hint">Format: Nama, No. KP/Staff ID (pilihan), Jabatan (pilihan)</p>
      </div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn ghost" id="btnBatal">Batal</button>
      <button type="submit" class="btn" id="btnSimpan">Simpan Kursus</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
<script>
const modal = document.getElementById("modalBaru");
document.getElementById("btnBaru").onclick = () => modal.showModal();
document.getElementById("btnTutup").onclick = () => modal.close();
document.getElementById("btnBatal").onclick = () => modal.close();

function statTag(status){
  return status === "Tamat" ? '<span class="status-tag tamat">Tamat</span>' : '<span class="status-tag">Aktif</span>';
}

function renderKursus(list){
  const grid = document.getElementById("kursusGrid");
  const empty = document.getElementById("emptyState");
  if (!list.length){
    grid.innerHTML = "";
    empty.style.display = "block";
    return;
  }
  empty.style.display = "none";
  grid.innerHTML = list.map(k => {
    const pct = k.jumlahPeserta ? Math.round((k.jumlahHadir / k.jumlahPeserta) * 100) : 0;
    return `
    <div class="card kursus-card ${k.status === "Tamat" ? "tamat" : ""}">
      ${statTag(k.status)}
      <h3>${escapeHtml(k.nama)}</h3>
      <div class="meta">
        <div>📅 <b>${escapeHtml(k.tarikh)}</b> ${k.masa ? "· " + escapeHtml(k.masa) : ""}</div>
        ${k.lokasi ? `<div>📍 ${escapeHtml(k.lokasi)}</div>` : ""}
        ${k.anjuran ? `<div>🏷️ ${escapeHtml(k.anjuran)}</div>` : ""}
      </div>
      <div class="progress-row">
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        <span class="progress-num">${k.jumlahHadir}/${k.jumlahPeserta}</span>
      </div>
      <div class="actions">
        <a class="btn sm" href="kursus.html?id=${k.id}">Urus Peserta</a>
        <a class="btn sm ghost" href="checkin.html?id=${k.id}" target="_blank">Buka Daftar Kehadiran ↗</a>
      </div>
    </div>`;
  }).join("");
}

async function load(){
  const res = await apiGet("listKursus");
  if (res.error){ showToast(res.error); return; }
  renderKursus(res.kursus || []);
}

document.getElementById("formBaru").addEventListener("submit", async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const payload = Object.fromEntries(fd.entries());
  const btn = document.getElementById("btnSimpan");
  btn.disabled = true; btn.textContent = "Menyimpan...";
  const res = await apiPost("createKursus", payload);
  btn.disabled = false; btn.textContent = "Simpan Kursus";
  if (res.error){ showToast(res.error); return; }
  modal.close();
  e.target.reset();
  showToast("Kursus berjaya dicipta");
  load();
});

load();
</script>
</body>
</html>
