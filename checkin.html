<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Kehadiran</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#20283D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kehadiran UPKV">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="kiosk" id="pickerView" style="display:none">
  <div class="kiosk-head">
    <div class="brand-mark">UPKV</div>
    <p class="eyebrow">Sistem Kehadiran Perbengkelan / Mesyuarat UPKV BPLTV</p>
    <h1>Pilih Kursus</h1>
  </div>
  <div class="kursus-picker" id="pickerList"></div>
</div>

<div class="kiosk" id="checkinView" style="display:none">
  <div class="kiosk-head">
    <div class="brand-mark">UPKV</div>
    <p class="eyebrow" id="tarikhKursus"></p>
    <h1 id="namaKursus"></h1>
  </div>
  <div class="kiosk-count">Kehadiran: <b id="countHadir">0</b> / <span id="countTotal">0</span> peserta</div>
  <p id="geofenceHint" class="install-hint" style="display:none; margin-top:-14px;">📍 Program ini perlukan pengesahan lokasi GPS untuk sahkan kehadiran</p>
  <div class="search-box">
    <input type="text" id="cari" placeholder="Taip nama anda..." autofocus>
  </div>
  <div class="result-list" id="resultList"></div>
  <p id="installHint" class="install-hint" style="display:none">📲 Nak pasang app ni kat skrin utama telefon? <button type="button" id="btnInstall" class="btn sm ghost">Pasang App</button></p>
</div>

<!-- Modal: Sahkan No. KP -->
<dialog id="modalIc">
  <form id="formIc">
    <div class="modal-head">
      <h2>Sahkan Kehadiran</h2>
      <button type="button" class="modal-close" id="icClose">&times;</button>
    </div>
    <div class="modal-body">
      <p style="margin-top:0; color:var(--ink-soft);">Untuk: <b id="icNamaPeserta" style="color:var(--ink);"></b></p>
      <p id="icModeHint" class="hint" style="margin-top:-8px; margin-bottom:14px;"></p>
      <div class="field" id="kodField" style="display:none;">
        <label>Kod Program</label>
        <input type="text" id="kodInput" placeholder="Kod yang diberikan di lokasi program" autocomplete="off">
      </div>
      <div class="field">
        <label>No. Kad Pengenalan (tanpa "-")</label>
        <input type="text" id="icInput" inputmode="numeric" maxlength="14" placeholder="cth: 900101011234" required autocomplete="off">
        <p class="hint" id="icError" style="color:var(--rust); display:none;"></p>
      </div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn ghost" id="icBatal">Batal</button>
      <button type="submit" class="btn" id="icSahkan">Sahkan</button>
    </div>
  </form>
</dialog>

<div class="stamp-overlay" id="stampOverlay">
  <div class="stamp-card">
    <div class="mark">✓ HADIR</div>
    <div class="who" id="stampNama"></div>
    <div class="when" id="stampMasa"></div>
    <button type="button" class="btn sm" id="btnSijil" style="margin-top:18px;">🎓 Muat Turun Sijil</button>
    <div><button type="button" class="btn sm ghost" id="btnTutupStamp" style="margin-top:10px;">Tutup</button></div>
  </div>
</div>

<script src="app.js"></script>
<script>
let pesertaCache = [];
let kursusInfo = null;
let pendingPeserta = null;
const id = qs("id");

async function loadPicker(){
  document.getElementById("pickerView").style.display = "block";
  const res = await apiGet("listKursus");
  const aktif = (res.kursus || []).filter(k => k.status === "Aktif");
  const wrap = document.getElementById("pickerList");
  if (!aktif.length){
    wrap.innerHTML = `<p style="text-align:center; color:var(--ink-soft)">Tiada kursus aktif buat masa ini.</p>`;
    return;
  }
  wrap.innerHTML = aktif.map(k => `
    <div class="pick-item" data-id="${k.id}">
      <h3>${escapeHtml(k.nama)}</h3>
      <div class="meta">${escapeHtml(k.tarikh)} ${k.masa ? "· " + escapeHtml(k.masa) : ""} ${k.lokasi ? "· " + escapeHtml(k.lokasi) : ""}</div>
    </div>`).join("");
  wrap.querySelectorAll("[data-id]").forEach(el => {
    el.onclick = () => { window.location.href = "checkin.html?id=" + el.dataset.id; };
  });
}

async function loadCheckin(){
  document.getElementById("checkinView").style.display = "block";
  const res = await apiGet("getKursusPublik", { id });
  if (res.error){ showToast(res.error); return; }
  kursusInfo = res.kursus;
  document.getElementById("namaKursus").textContent = kursusInfo.nama;
  document.getElementById("tarikhKursus").textContent =
    [kursusInfo.tarikh, kursusInfo.masa, kursusInfo.lokasi].filter(Boolean).join(" · ");
  document.getElementById("geofenceHint").style.display = kursusInfo.geofence ? "flex" : "none";
  pesertaCache = res.peserta || [];
  renderCount();
  renderList(pesertaCache);
}

function renderCount(){
  document.getElementById("countTotal").textContent = pesertaCache.length;
  document.getElementById("countHadir").textContent = pesertaCache.filter(p => p.hadir).length;
}

function renderList(list){
  const wrap = document.getElementById("resultList");
  if (!list.length){
    wrap.innerHTML = `<p style="text-align:center; color:var(--ink-soft); padding:20px 0;">Tiada nama sepadan. Sila hubungi urus setia.</p>`;
    return;
  }
  wrap.innerHTML = list.slice(0, 30).map(p => `
    <div class="result-item" data-id="${p.id}">
      <div>
        <div class="name">${escapeHtml(p.nama)}</div>
        ${p.jabatan ? `<div class="sub">${escapeHtml(p.jabatan)}</div>` : ""}
      </div>
      <div>${p.hadir ? '<span class="tag hadir">✓ Sudah Daftar · tap sijil</span>' : '<span class="tag belum">Tap untuk daftar</span>'}</div>
    </div>`).join("");
}

// Tap nama -> buka modal pengesahan No. KP (peserta yang dah hadir pun boleh
// tap semula untuk muat turun sijil, sekali lagi disahkan dengan No. KP).
document.getElementById("resultList").addEventListener("click", (e) => {
  const item = e.target.closest(".result-item");
  if (!item) return;
  const p = pesertaCache.find(x => x.id === item.dataset.id);
  if (!p) return;
  pendingPeserta = p;
  document.getElementById("icNamaPeserta").textContent = p.nama;
  document.getElementById("icModeHint").textContent = p.hadir
    ? "Sudah didaftarkan — masukkan No. KP yang sama seperti semasa daftar pertama untuk muat turun sijil."
    : "Kali pertama? Masukkan No. KP anda — ia akan disimpan sebagai rekod rasmi kehadiran anda.";
  document.getElementById("icInput").value = "";
  document.getElementById("kodInput").value = "";
  document.getElementById("kodField").style.display = kursusInfo.kodRequired ? "block" : "none";
  document.getElementById("icError").style.display = "none";
  document.getElementById("modalIc").showModal();
  setTimeout(() => document.getElementById("icInput").focus(), 50);
});

document.getElementById("icClose").onclick = () => document.getElementById("modalIc").close();
document.getElementById("icBatal").onclick = () => document.getElementById("modalIc").close();

document.getElementById("formIc").addEventListener("submit", async (e) => {
  e.preventDefault();
  const ic = document.getElementById("icInput").value.trim();
  const kod = document.getElementById("kodInput").value.trim();
  const btn = document.getElementById("icSahkan");
  const errEl = document.getElementById("icError");
  errEl.style.display = "none";

  let coords = {};
  if (kursusInfo.geofence) {
    btn.disabled = true; btn.textContent = "Mengesan lokasi GPS...";
    try {
      const pos = await getCurrentPositionAsync();
      coords = { lat: pos.coords.latitude, lon: pos.coords.longitude };
    } catch (err) {
      btn.disabled = false; btn.textContent = "Sahkan";
      errEl.textContent = "Sila benarkan akses lokasi (GPS) — program ini memerlukan pengesahan kawasan. (" + err.message + ")";
      errEl.style.display = "block";
      return;
    }
  }

  btn.disabled = true; btn.textContent = "Menyemak...";
  const res = await apiPost("sahkanKehadiran", { pesertaId: pendingPeserta.id, ic, kod, ...coords });
  btn.disabled = false; btn.textContent = "Sahkan";
  if (res.error){
    errEl.textContent = res.error;
    errEl.style.display = "block";
    return;
  }
  document.getElementById("modalIc").close();
  pendingPeserta.hadir = true;
  renderCount();
  document.getElementById("cari").value = "";
  renderList(pesertaCache);

  document.getElementById("stampNama").textContent = res.nama || pendingPeserta.nama;
  document.getElementById("stampMasa").textContent = res.masa;
  document.getElementById("stampOverlay").classList.add("show");
  document.getElementById("btnSijil").onclick = async () => {
    const dataUrl = await generateSijilDataUrl({
      nama: res.nama || pendingPeserta.nama,
      namaKursus: kursusInfo.nama,
      tarikh: kursusInfo.tarikh,
      lokasi: kursusInfo.lokasi,
    });
    downloadDataUrl(dataUrl, "sijil-" + (res.nama || pendingPeserta.nama).replace(/\s+/g, "-") + ".png");
  };
});

document.getElementById("btnTutupStamp").onclick = () => {
  document.getElementById("stampOverlay").classList.remove("show");
  document.getElementById("cari").focus();
};

document.getElementById("cari")?.addEventListener("input", (e) => {
  const q = e.target.value.trim().toLowerCase();
  renderList(q ? pesertaCache.filter(p => p.nama.toLowerCase().includes(q)) : pesertaCache);
});

// Prompt "Pasang App" (PWA install)
let deferredInstallPrompt = null;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  document.getElementById("installHint").style.display = "block";
});
document.getElementById("btnInstall").addEventListener("click", async () => {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  document.getElementById("installHint").style.display = "none";
});

if (id) { loadCheckin(); } else { loadPicker(); }
registerServiceWorker();
</script>
</body>
</html>
